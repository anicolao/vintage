name: Verify and preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command npm ci
      - run: nix develop --command npm ci --prefix functions
      - run: nix develop --command npm run test:hooks
      - run: nix develop --command npm run test:domain
      - run: nix develop --command npm run test:config
      - run: nix develop --command npm run check
      - run: nix develop --command npm run lint:e2e
      - name: Verify owner rules and browser flows
        run: nix develop --command npm run test:foundation
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: firebase-review-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command npm ci
      - run: nix develop --command npm ci --prefix functions
      - name: Verify backend compatibility
        run: node scripts/backend-digest.mjs --check
        env:
          FIREBASE_BACKEND_SHA256: ${{ vars.FIREBASE_BACKEND_SHA256 }}
      - name: Build live Firebase preview
        run: nix develop --command npm run build:live
        env:
          VINTAGE_WORKSPACE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy rules and Hosting
        run: nix develop --command node scripts/deploy-preview.mjs
        env:
          FIREBASE_BACKEND_SHA256: ${{ vars.FIREBASE_BACKEND_SHA256 }}
      - name: Verify deployed revision and direct route
        run: node scripts/check-preview.mjs
      - name: Publish review details
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('preview.json', 'utf8'));
          console.log(`## Live Firebase preview\n\n[Open preview](${p.url})\n\nProject: ${p.projectId}\n\nWorkspace: ${p.workspace}\n\nRevision: ${p.revision}\n\nBackend: live Auth, Firestore and Storage.\n\nReviewer: sign in with Google, start a new listing, add a photo and context, reload its direct URL, switch system appearance and verify second-account isolation.`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: live-preview
          path: preview.json
